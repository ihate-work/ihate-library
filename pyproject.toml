[project]
name = "local-ihate-work"
description = "ihate_work.* shared Python packages"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ihate_work"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
consider_namespace_packages = true
addopts = [
  "--ignore=src/ihate_work/llm",
  "--ignore=src/ihate_work/storage",
  "--ignore=src/ihate_work/util/concurrency/test_loky_executor.py",
  "--ignore=src/ihate_work/util/prefix_counter_test.py",
  "--ignore=src/ihate_work/util/text_cleaner",
]
